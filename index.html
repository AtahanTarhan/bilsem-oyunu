    <!-- Audio Synthesizer for SFX (No External Assets Needed) -->
    <script>
        // Web Audio API for Game SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                osc.frequency.linearRampToValueAtTime(130.81, audioCtx.currentTime + 0.2); // C3
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }
    </script>

        // INITIALIZE APP
        window.onload = () => {
            updateScoreUI();
            renderLevelMap();
        };

        // Render Level Map Screen
        function renderLevelMap() {
            document.getElementById('levelMapView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('headerSubtitle').innerText = "50 Seviyeli Mantık Oyunu";

            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 50; i++) {
                const isUnlocked = i <= unlockedLevel;
                const isCurrent = i === unlockedLevel;

                const btn = document.createElement('button');
                btn.className = `w-12 h-12 sm:w-14 sm:h-14 rounded-2xl font-bold text-base sm:text-lg flex flex-col items-center justify-center transition-all btn-bounce relative ${
                    isUnlocked 
                        ? isCurrent 
                            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-300 border-2 border-indigo-400 level-current' 
                            : 'bg-emerald-500 text-white shadow-md hover:bg-emerald-600'
                        : 'bg-slate-200 text-slate-400 cursor-not-allowed border border-slate-300'
                }`;

                btn.disabled = !isUnlocked;
                btn.onclick = () => startLevel(i);

                if (isUnlocked) {
                    if (i < unlockedLevel) {
                        btn.innerHTML = `<span>${i}</span><i class="fa-solid fa-check text-[10px] opacity-80"></i>`;
                    } else {
                        btn.innerHTML = `<span>${i}</span><i class="fa-solid fa-play text-[10px] opacity-80"></i>`;
                    }
                } else {
                    btn.innerHTML = `<span>${i}</span><i class="fa-solid fa-lock text-[10px]"></i>`;
                }

                grid.appendChild(btn);
            }

            document.getElementById('progressText').innerText = `İlerleme: ${unlockedLevel - 1} / 50`;
        }

        // Show Level Map from Button
        function showLevelMap() {
            playSound('click');
            renderLevelMap();
        }

        // Start Question Game
        function startLevel(lvlNum) {
            playSound('click');
            currentLevel = lvlNum;
            const qData = questions.find(q => q.level === lvlNum);

            if (!qData) return;

            document.getElementById('levelMapView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');

            document.getElementById('levelBadge').innerText = `SEVİYE ${qData.level}`;
            document.getElementById('categoryBadge').innerText = qData.category;
            document.getElementById('questionText').innerText = qData.q;
            document.getElementById('visualContainer').innerHTML = qData.visual;

            // Render Options
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';

            // Shuffle options for variety
            const shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const optBtn = document.createElement('button');
                optBtn.className = "w-full bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-400 text-slate-700 font-bold py-3 px-4 rounded-2xl shadow-sm text-sm sm:text-base transition btn-bounce flex items-center justify-center min-h-[52px]";
                optBtn.innerText = opt;
                optBtn.onclick = () => checkAnswer(opt, qData.answer, optBtn);
                optionsGrid.appendChild(optBtn);
            });
        }

        // Check Answer Logic
        function checkAnswer(selected, correct, btnElement) {
            const allBtns = document.querySelectorAll('#optionsGrid button');
            allBtns.forEach(b => b.disabled = true);

            if (selected === correct) {
                // Correct Answer
                playSound('correct');
                btnElement.classList.remove('bg-white', 'border-slate-200');
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'animate-pulse');

                score += 20;
                localStorage.setItem('bilsem_score', score);
                updateScoreUI();

                // Unlock Next Level
                if (currentLevel === unlockedLevel && unlockedLevel < 50) {
                    unlockedLevel++;
                    localStorage.setItem('bilsem_unlocked', unlockedLevel);
                }

                // Trigger Confetti
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.7 }
                });

                setTimeout(() => {
                    showSuccessModal();
                }, 700);

            } else {
                // Wrong Answer
                playSound('wrong');
                btnElement.classList.remove('bg-white', 'border-slate-200');
                btnElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600');

                // Highlight correct one
                allBtns.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
                    }
                });

                setTimeout(() => {
                    alert("Yanlış cevap! Tekrar deneyin.");
                    startLevel(currentLevel); // Retry
                }, 1000);
            }
        }

        // Show Success Modal
        function showSuccessModal() {
            const modal = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            const nextBtn = document.getElementById('modalNextBtn');

            if (currentLevel === 50) {
                modalTitle.innerText = "Tebrikler Şampiyon! 🎉";
                modalDesc.innerText = "50 Seviyenin tamamını bitirerek BİLSEM Zeka Parkurunu tamamladın!";
                nextBtn.innerHTML = `<span>Ana Menüye Dön</span> <i class="fa-solid fa-house"></i>`;
                nextBtn.onclick = () => {
                    modal.classList.add('hidden');
                    renderLevelMap();
                };
            } else {
                modalTitle.innerText = "Tebrikler!";
                modalDesc.innerText = `Seviye ${currentLevel} tamamlandı. +20 Puan Kazandın!`;
                nextBtn.innerHTML = `<span>Sonraki Seviye</span> <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.onclick = () => {
                    modal.classList.add('hidden');
                    startLevel(currentLevel + 1);
                };
            }

            modal.classList.remove('hidden');
        }

        // Update Score UI
        function updateScoreUI() {
            document.getElementById('scoreDisplay').innerText = score;
        }

        // Reset All Progress
        function resetProgress() {
            if (confirm("Tüm ilerlemeniz sıfırlanacak. Emin misiniz?")) {
                localStorage.removeItem('bilsem_unlocked');
                localStorage.removeItem('bilsem_score');
                unlockedLevel = 1;
                score = 0;
                updateScoreUI();
                renderLevelMap();
            }
        }
    </script>
